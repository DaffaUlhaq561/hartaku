# ============================================================
# Nixpacks fallback for REPO ROOT build context
# (jika Railway di-set Root Directory = /  bukan /backend)
# ============================================================

[phases.setup]
  aptPkgs = [
    'libxcb1',
    'libx11-6',
    'libglib2.0-0',
    'libsm6',
    'libxrender1',
    'libxext6',
    'libgl1-mesa-glx',
    'libgtk2.0-0',
    'libbz2-1.0',
    'libpango-1.0-0',
    'libcairo2',
    'libgdk-pixbuf2.0-0',
    'ffmpeg'
  ]

[phases.build]
  cmds = [
    'pip install --no-cache-dir --upgrade pip setuptools wheel',
    'pip install --no-cache-dir "opencv-python-headless>=4.8.0"',
    'pip install --no-cache-dir -r backend/requirements.txt',
    'pip uninstall -y opencv-python opencv-contrib-python 2>/dev/null || true',
    'pip install --no-cache-dir --force-reinstall "opencv-python-headless>=4.8.0"'
  ]

[start]
  cmd = 'cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}'

[environment]
  QT_QPA_PLATFORM = 'offscreen'
  OPENCV_IO_ENABLE_OPENEXR = '1'
  DISPLAY = ''
