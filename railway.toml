# ============================================================
# Railway.app Configuration - HARTaku Backend FastAPI
# ⚠️ Internal Container Port = SELALU 8000 (uvicorn --port 8000)
# Railway Domain harus mapping ke INTERNAL PORT 8000, BUKAN 8080!
# ============================================================

[build]
  builder = "dockerfile"
  dockerfilePath = "./Dockerfile"
  dockerContext = "."

[deploy]
  # Port internal di DALAM container = 8000 (JANGAN DIUBAH!)
  startCommand = "uvicorn main:app --host 0.0.0.0 --port 8000"
  healthcheckPath = "/health"
  healthcheckTimeout = 120
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10

# ============================================================
# PERHATIAN: PORT HARUS 8000 (sesuai uvicorn listen --port 8000)
# Jika di UI Railway Networking domain masih Port 8080:
#   Klik EDIT domain itu → Target Port → Ubah ke 8000, Save.
# ============================================================
[[services]]
  name = "hartaku-backend"
  rootDirectory = "./backend"
  [services.build]
    builder = "dockerfile"
    dockerfilePath = "./Dockerfile"
    dockerContext = "."
    # Wajib no-cache untuk menghindari opencv-python GUI tersimpan di cache layer
    # (Tidak semua versi Railway support ini, jadi tetap redeploy via UI: Redeploy WITHOUT cache)
    # buildWithoutCache = true
  [services.deploy]
    startCommand = "uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheckPath = "/health"
    healthcheckTimeout = 120
    restartPolicyType = "on_failure"
    restartPolicyMaxRetries = 10
  # SINGLE HTTP PORT yang benar: INTERNAL PORT CONTAINER = 8000!
  [[services.ports]]
    port = 8000
    type = "HTTP"
    # expose public default true. Untuk UI network pastikan domain mengarah ke port 8000 ini.
  [services.env]
    PORT = "8000"
    QT_QPA_PLATFORM = "offscreen"
    OPENCV_IO_ENABLE_OPENEXR = "1"
    DISPLAY = ""
    PYTHONUNBUFFERED = "1"
